<!doctype html>
<html><head><meta charset="utf-8"><title>Side by side</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/jsm/" } }</script>
<style>
  html, body { margin: 0; background: #121418; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; }
  canvas { display: block; }
  .lbl { position: absolute; top: 14px; width: 640px; text-align: center; font-weight: 700; font-size: 26px; text-shadow: 0 2px 4px #000; }
  .sub { position: absolute; top: 48px; width: 640px; text-align: center; font-size: 17px; color: #dfe3ea; text-shadow: 0 2px 4px #000; }
  #div { position: absolute; left: 639px; top: 0; width: 2px; height: 720px; background: #2e333e; }
  #foot { position: absolute; bottom: 10px; width: 1280px; text-align: center; color: #8b93a3; font-size: 15px; }
</style></head>
<body><div id="wrap">
  <div class="lbl" style="left:0;color:#ffb74d" id="ttlL">Simple GLB Editor</div><div class="sub" style="left:0" id="subL"></div>
  <div class="lbl" style="left:640px;color:#4fc3f7" id="ttlR">Blender + Rigify script</div><div class="sub" style="left:640px" id="subR"></div>
  <div id="div"></div><div id="foot"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = 1280, Hh = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, Hh); renderer.setScissorTest(true);
document.getElementById('wrap').prepend(renderer.domElement);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sides = [];
async function addSide(url, x) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c1f26); scene.environment = env;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 4, 3); scene.add(sun);
  const grid = new THREE.GridHelper(6, 30, 0x4a5263, 0x2e333e); scene.add(grid);
  const gltf = await new GLTFLoader().loadAsync(url);
  const holder = new THREE.Group(); holder.add(gltf.scene); scene.add(holder);
  gltf.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  gltf.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(gltf.scene, true); const size = box.getSize(new THREE.Vector3());
  gltf.scene.position.y -= box.min.y; // feet on the grid
  const mixer = new THREE.AnimationMixer(gltf.scene), clip = gltf.animations[0];
  mixer.clipAction(clip).play();
  let hips = null; gltf.scene.traverse(o => { if (!hips && o.isBone && /hips|torso|spine$/i.test(o.name)) hips = o; });
  if (!hips) gltf.scene.traverse(o => { if (!hips && o.isBone) hips = o; });
  const cam = new THREE.PerspectiveCamera(30, 640 / Hh, 0.01, 100);
  const H = size.y, dist = H * 3.3;
  sides.push({ scene, mixer, clip, hips, holder, cam, x, H, dist, grid });
}
await addSide(q.get('a'), 0);
await addSide(q.get('b'), 640);
document.getElementById('subL').textContent = q.get('la') || '';
document.getElementById('subR').textContent = q.get('lb') || '';
document.getElementById('foot').textContent = q.get('foot') || '';
if (q.get('ta')) document.getElementById('ttlL').textContent = q.get('ta'); // optional titles (defaults: the race)
if (q.get('tb')) document.getElementById('ttlR').textContent = q.get('tb');
const tmp = new THREE.Vector3();
/** Draw both sides at time t (seconds). The camera follows each character's forward travel. */
window.drawAt = (t, yawDeg = 35) => {
  for (const s of sides) {
    s.mixer.setTime(t % s.clip.duration);
    s.holder.position.set(0, 0, 0); s.holder.updateMatrixWorld(true);
    const hp = s.hips ? s.hips.getWorldPosition(tmp).clone() : new THREE.Vector3();
    s.holder.position.set(-hp.x * 0, 0, -hp.z); // cancel forward travel (z) so both stay centred
    s.grid.position.z = (-hp.z) % 0.2;          // ground still scrolls a little, so you can see who travels
    const a = THREE.MathUtils.degToRad(yawDeg);
    s.cam.position.set(Math.sin(a) * s.dist, s.H * 0.75, Math.cos(a) * s.dist);
    s.cam.lookAt(0, s.H * 0.5, 0);
    renderer.setViewport(s.x, 0, 640, Hh); renderer.setScissor(s.x, 0, 640, Hh);
    renderer.render(s.scene, s.cam);
  }
};
window.sides = sides;
window.drawAt(0);
window.ready = true;
</script></body></html>
