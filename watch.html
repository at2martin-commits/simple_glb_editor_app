<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Watching — Simple GLB Editor</title>
<link rel="icon" href="/icon.png">
<style>
  :root { color-scheme: dark; --bg: #2b2d31; --bar: #1d1f23ee; --text: #e6e6e6; --muted: #9aa0a6; --accent: #ff8c1a; --live: #3ddc84; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--bar); flex-wrap: wrap; }
  #live { font-weight: 600; color: var(--muted); white-space: nowrap; }
  #live.on { color: var(--live); }
  #live::before { content: "●"; margin-right: 5px; }
  #file { font-weight: 600; }
  #mode { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  #msg { color: var(--muted); flex: 1 1 260px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tools { display: flex; gap: 6px; }
  select { background: #3a3d43; color: var(--text); border: 1px solid #50545b; border-radius: 5px; padding: 4px 6px; font: inherit; max-width: 46vw; }
  select[hidden] { display: none; }
  button { background: #3a3d43; color: var(--text); border: 1px solid #50545b; border-radius: 5px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #474b52; }
  #empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; text-align: center; padding: 16px; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="bar">
  <span id="live">Connecting…</span>
  <select id="tabPick" hidden title="Which editor tab to watch. “Follow the editor” shows whatever tab is picked in the editor; 🤖 = a Claude session's tab."></select>
  <span id="file"></span>
  <span id="mode"></span>
  <span id="msg"></span>
  <span id="tools"><button id="btnFrame" title="Fit the model in view">Frame</button><button id="btnBones" title="Show or hide the skeleton">Bones</button></span>
</div>
<div id="empty">Waiting for the editor…</div>
<div id="hint">View only · drag to turn · right-drag / two fingers to slide · wheel / pinch to zoom</div>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/jsm/" } }
</script>
<script type="module" src="/src/watch-viewer.js"></script>
</body>
</html>
